name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detects whether this push/PR touches anything besides documentation
  # (**.md, docs/**, .gitignore). The three jobs below all `needs: changes` and
  # gate on `outputs.code`, rather than filtering at the workflow trigger level
  # with `paths-ignore` — a `paths-ignore`'d workflow doesn't run *at all* for a
  # docs-only change, which leaves any required status check depending on it
  # permanently stuck on "Expected — waiting for status to be reported" (GitHub
  # never gets a status to report). A job skipped via `if:` still reports a
  # "skipped" conclusion, which branch protection accepts as passing for a
  # required check, so this achieves the same "don't waste CI on doc changes"
  # goal without ever leaving a required check with no result at all.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Filter changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.gitignore'

  static-analysis:
    name: Static Analysis (ktlint & detekt)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only needed if you enable the optional SARIF upload step below.
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        # Runs even if ktlint already failed, so a single push surfaces both sets of findings.
        if: always()
        run: ./gradlew detekt

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            feature/*/build/reports/ktlint/
            core/*/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            app/build/reports/detekt/
            feature/*/build/reports/detekt/
            core/*/build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore

      # Optional: surfaces detekt findings as inline PR annotations via GitHub code scanning.
      # Requires `security-events: write` above and (for private repos) GitHub Advanced Security.
      # Uncomment once you've verified the SARIF files are produced under build/reports/detekt/.
      # - name: Upload detekt SARIF to code scanning
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: .
      #     category: detekt

  test-build:
    name: Test, Lint & Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        # Runs testDebugUnitTest AND testReleaseUnitTest for every module, so the full
        # test-reports artifact below covers both variants — not just the debug coverage
        # task's own dependency on testDebugUnitTest.
        run: ./gradlew test

      - name: Generate project coverage dashboard
        # aggregateCoverageReport (root build.gradle.kts) dependsOn all 5 module-level
        # coverage tasks below, so this single call regenerates every module's
        # report.xml/jacocoTestReport.xml AND the merged local dashboard in one go:
        #   :app:createDebugUnitTestCoverageReport
        #   :core:network:createDebugUnitTestCoverageReport
        #   :core:ui:createDebugUnitTestCoverageReport
        #   :core:common:jacocoTestReport
        #   :feature:stocklist:createDebugUnitTestCoverageReport
        run: ./gradlew aggregateCoverageReport

      - name: Upload app coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: app
          fail_ci_if_error: false
          verbose: true

      - name: Upload core:network coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/network/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: core-network
          fail_ci_if_error: false
          verbose: true

      - name: Upload core:ui coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/ui/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: core-ui
          fail_ci_if_error: false
          verbose: true

      - name: Upload core:common coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/common/build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          flags: core-common
          fail_ci_if_error: false
          verbose: true

      - name: Upload feature:stocklist coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: feature/stocklist/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: feature-stocklist
          fail_ci_if_error: false
          verbose: true

      - name: Upload aggregated coverage dashboard
        # Local raw JaCoCo dashboard (build/reports/coverage-aggregate/index.html) — a
        # single-file-to-download overview across all 5 modules. NOT the same number as
        # Codecov's project percentage above; see the notice on the dashboard page itself.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dashboard
          path: build/reports/coverage-aggregate/
          retention-days: 14
          if-no-files-found: ignore

      - name: Android Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile Android instrumentation tests
        # Compile-only check — no emulator required. androidTest source sets (e.g. StockDaoTest)
        # aren't touched by `test` (JVM-only), `lint`, or `assembleDebug` above, so a production
        # API change can silently break them without any of those tasks noticing. This step only
        # catches compile-time breakage; actually running the tests still requires
        # `./gradlew :feature:stocklist:connectedDebugAndroidTest` against a device/emulator,
        # which is intentionally not run in this workflow (see README → Continuous Integration).
        run: ./gradlew :feature:stocklist:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            feature/stocklist/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            feature/stocklist/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 is required here — gitleaks-action scans commit history via `git log`, and
      # the default shallow (depth-1) checkout would only expose the single triggering commit,
      # silently turning this into a scan of almost nothing.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
