name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis (ktlint & detekt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only needed if you enable the optional SARIF upload step below.
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        # Runs even if ktlint already failed, so a single push surfaces both sets of findings.
        if: always()
        run: ./gradlew detekt

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            feature/*/build/reports/ktlint/
            core/*/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            app/build/reports/detekt/
            feature/*/build/reports/detekt/
            core/*/build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore

      # Optional: surfaces detekt findings as inline PR annotations via GitHub code scanning.
      # Requires `security-events: write` above and (for private repos) GitHub Advanced Security.
      # Uncomment once you've verified the SARIF files are produced under build/reports/detekt/.
      # - name: Upload detekt SARIF to code scanning
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: .
      #     category: detekt

  test-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew test

      - name: Generate unit test coverage
        run: ./gradlew :feature:stocklist:createDebugUnitTestCoverageReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: feature/stocklist/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: unit-tests
          fail_ci_if_error: false
          verbose: true

      - name: Android Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile Android instrumentation tests
        # Compile-only check — no emulator required. androidTest source sets (e.g. StockDaoTest)
        # aren't touched by `test` (JVM-only), `lint`, or `assembleDebug` above, so a production
        # API change can silently break them without any of those tasks noticing. This step only
        # catches compile-time breakage; actually running the tests still requires
        # `./gradlew :feature:stocklist:connectedDebugAndroidTest` against a device/emulator,
        # which is intentionally not run in this workflow (see README → Continuous Integration).
        run: ./gradlew :feature:stocklist:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            feature/stocklist/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            feature/stocklist/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 is required here — gitleaks-action scans commit history via `git log`, and
      # the default shallow (depth-1) checkout would only expose the single triggering commit,
      # silently turning this into a scan of almost nothing.
      #
      # Still pinned to v4 here for consistency with the other two jobs above, even though
      # gitleaks-action@v3's own docs recommend actions/checkout@v6 for Node 24 alignment ahead
      # of GitHub's Sept 16, 2026 Node 20 removal. Bumping checkout across the whole workflow is
      # a separate, repo-wide follow-up rather than a one-off version in a single job.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
