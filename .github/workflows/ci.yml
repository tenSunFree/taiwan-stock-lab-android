name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  # Only needed if you enable the optional SARIF upload step below.
  security-events: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis (ktlint & detekt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        # Runs even if ktlint already failed, so a single push surfaces both sets of findings.
        if: always()
        run: ./gradlew detekt

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            feature/*/build/reports/ktlint/
            core/*/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            app/build/reports/detekt/
            feature/*/build/reports/detekt/
            core/*/build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore

      # Optional: surfaces detekt findings as inline PR annotations via GitHub code scanning.
      # Requires `security-events: write` above and (for private repos) GitHub Advanced Security.
      # Uncomment once you've verified the SARIF files are produced under build/reports/detekt/.
      # - name: Upload detekt SARIF to code scanning
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: .
      #     category: detekt

  test-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew test

      - name: Android Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            feature/stocklist/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            feature/stocklist/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
