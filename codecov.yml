codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "40...80"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true

    patch:
      default:
        target: 70%
        threshold: 0%
        only_pulls: true
        informational: true

comment:
  layout: "reach,diff,files"
  behavior: default
  require_changes: false

ignore:
  - "**/build/**"
  - "**/src/test/**"
  - "**/src/androidTest/**"
