codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "40...80"

  status:
    project:
      default:
        target: auto      # Compare against the baseline commit, rather than hardcoding 70%.
        threshold: 1%      # Minor fluctuations allowed
        informational: false   # A PR that actually prevents regression

    patch:
      default:
        target: 70%
        threshold: 0%
        only_pulls: true
        informational: false   # Aim for ≥70% starting now

flags:
  app:
    paths:
      - app/src/main/
  core-common:
    paths:
      - core/common/src/main/
  core-network:
    paths:
      - core/network/src/main/
  core-ui:
    paths:
      - core/ui/src/main/
  feature-stocklist:
    paths:
      - feature/stocklist/src/main/

comment:
  layout: "reach,diff,files"
  behavior: default
  require_changes: false

ignore:
  - "**/build/**"
  - "**/src/test/**"
  - "**/src/androidTest/**"
  # Room's generated DAO/Database implementations. Only StockDaoTest and
  # StockDatabaseMigrationTest (androidTest) actually exercise these, and androidTest
  # isn't run on an emulator in CI, so this code can never show real coverage here.
  - "**/*_Impl.kt"
  - "**/*_Impl.java"
  # ViewBinding generated classes — require inflating a real View (Robolectric/instrumentation)
  # to exercise; there's no business logic in them to test.
  - "**/databinding/**"
  - "**/*Binding.kt"
  - "**/*Binding.java"
  # Hilt/Dagger annotation-processor output — pure DI wiring, no business logic.
  - "**/hilt_aggregated_deps/**"
  - "**/Hilt_*.kt"
  - "**/Hilt_*.java"
  - "**/*_Factory.kt"
  - "**/*_Factory.java"
  - "**/*_MembersInjector.kt"
  - "**/*_MembersInjector.java"
  - "**/*_HiltComponents.kt"
  - "**/*_HiltComponents.java"
  - "**/*_HiltModules*.kt"
  - "**/*_HiltModules*.java"
  # NOTE: Moshi's generated *JsonAdapter classes are intentionally NOT ignored here —
  # DtoJsonAdapterTest exercises them directly with real JSON, so they should count.
  # Hilt application entry point; contains no handwritten logic.
  - "app/src/main/java/**/TaiwanStockApplication.kt"
  # Note: MainActivity is not excluded; it contains actual UI state collection and error
  # handling logic. Tests for it will be added later using Robolectric rather than
  # excluding it.
